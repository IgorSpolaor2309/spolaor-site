# Execução MANUAL da rotina do atendimento com IA (contingência e diagnóstico). O agendamento fica no
# QStash, a cada 5 minutos, com o cron diário da Vercel para a conciliação com o ZappMillion. O agendamento
# do GitHub foi retirado: não disparou em produção e, se voltasse, só duplicaria as execuções.
name: Atendimento IA - rotina

on:
  workflow_dispatch:

permissions: {}

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar a rotina em produção
        env:
          CRON_SECRET: ${{ secrets.IA_CRON_SECRET }}
          URL: ${{ vars.IA_ROTINA_URL || 'https://www.spolaortecnologia.com.br/api/atendimento-ia/cron' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "IA_CRON_SECRET não configurado; nada a fazer."; exit 0; fi
          code=$(curl -s -o resposta.json -w "%{http_code}" --max-time 120 -H "authorization: Bearer $CRON_SECRET" -H "user-agent: github-actions-rotina" "$URL")
          echo "HTTP $code"
          python3 -c "import json;d=json.load(open('resposta.json'));print('ok' if d.get('ok') else 'falha', d.get('skipped') or len(d.get('report') or []), 'itens')" || true
          [ "$code" = "200" ]
